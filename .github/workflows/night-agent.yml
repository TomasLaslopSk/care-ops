name: night-agent

# Runs the agent in the CLOUD (no Mac needed) and posts a run record to the live
# care-api, where the admin reviews it in the Agent Runs UI. Cron is UTC.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly (the "real" cadence)
    # DEMO — interview window only: Thu Jun 25, ~13:00 local (GMT+2) = 11:00 UTC.
    # Date-pinned to the 25th so it auto-stops afterwards. Remove after the demo if you like.
    - cron: "45,55 10 25 6 *" # 12:45 & 12:55 local — warm-up so the page already has fresh runs
    - cron: "*/10 11 25 6 *" # 13:00,13:10,…,13:50 local — during the interview
  workflow_dispatch: {} # also runnable on demand from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Post an agent run to the live API
        run: node .agents/run-agent.mjs
        env:
          AGENT_API: ${{ secrets.AGENT_API }} # e.g. https://care.prevlasy.sk
          AGENT_INGEST_KEY: ${{ secrets.AGENT_INGEST_KEY }}
