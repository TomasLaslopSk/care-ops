name: CI

on:
  # Web + API pipeline — runs only when those folders (or this workflow) change.
  # The mobile app has its own workflow (.github/workflows/mobile.yml).
  push:
    branches: [main]
    paths:
      - "care-ops-console/**"
      - "care-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "care-ops-console/**"
      - "care-api/**"
      - ".github/workflows/ci.yml"

jobs:
  web:
    name: care-ops-console (test + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: care-ops-console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --legacy-peer-deps
      - run: npm run test
      - run: npm run build

  api:
    name: care-api (typecheck)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: care-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tsc --noEmit

  e2e:
    name: care-ops-console (Playwright e2e)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: care-ops-console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --legacy-peer-deps
      - run: npm --prefix ../care-api install
      - run: npx playwright install --with-deps chromium
      # Playwright boots the real care-api + a production preview of the console
      # (see playwright.config.ts webServer), runs the specs, then tears them down.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: care-ops-console/playwright-report
          retention-days: 7
