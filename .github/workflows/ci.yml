name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  web:
    name: care-ops-console (test + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: care-ops-console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --legacy-peer-deps
      - run: npm run test
      - run: npm run build

  api:
    name: care-api (typecheck)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: care-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tsc --noEmit
